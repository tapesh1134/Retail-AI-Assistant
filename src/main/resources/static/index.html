<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Retail AI Assistant Demo</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0}
    .app{max-width:900px;margin:40px auto;padding:20px}
    .card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px}
    h1{margin-top:0}
    #messages{height:430px;overflow:auto;border:1px solid #ddd;border-radius:10px;padding:14px;background:#fafafa}
    .msg{padding:10px 12px;margin:8px 0;border-radius:10px;max-width:80%;white-space:pre-wrap}
    .user{background:#e8f0fe;margin-left:auto}
    .ai{background:#eee}
    .row{display:flex;gap:10px;margin-top:12px}
    input{flex:1;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:16px}
    button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer}
    .examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .examples button{background:#eee}
    .meta{font-size:12px;color:#666;margin-top:10px}
  </style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>Retail AI Assistant</h1>
    <p>Demo: order status, returns/refunds, and product compatibility.</p>

    <div class="examples">
      <button onclick="ask('Where is order 10001?')">Order 10001</button>
      <button onclick="ask('Can I return a product after 20 days?')">Return policy</button>
      <button onclick="ask('Is CHARGER-65W compatible with LAPTOP-USB-C?')">Compatibility</button>
    </div>

    <div id="messages"></div>

    <form class="row" id="form">
      <input id="input" placeholder="Ask a support question..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const meta = document.getElementById('meta');

function add(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function ask(message) {
  if (!message) return;
  add(message, 'user');
  input.value = '';
  const ai = add('', 'ai');
  const start = performance.now();

  const response = await fetch('/api/chat/stream', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({message})
  });

  if (!response.ok || !response.body) {
    ai.textContent = 'Request failed. Check the backend and OPENAI_API_KEY.';
    return;
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream:true});
    const parts = buffer.split('\\n\\n');
    buffer = parts.pop();

    for (const part of parts) {
      if (part.startsWith('data: ')) {
        ai.textContent += part.substring(6).replace(/\\\\n/g, '\\n');
        messages.scrollTop = messages.scrollHeight;
      }
    }
  }

  meta.textContent = 'Stream completed in ' + Math.round(performance.now() - start) + ' ms';
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  ask(input.value.trim());
});
</script>
</body>
</html>
